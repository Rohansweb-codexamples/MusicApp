<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private AI Music Studio</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #111827;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 450px;
            border: 1px solid #1f2937;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            text-align: center;
            color: #3b82f6;
        }
        .input-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            color: #9ca3af;
        }
        input[type="text"] {
            width: 100%;
            padding: 0.75rem;
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 8px;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #1d4ed8; }
        button:disabled { background-color: #4b5563; cursor: not-allowed; }
        .audio-output {
            margin-top: 1.5rem;
            display: none;
        }
        audio { width: 100%; margin-top: 0.5rem; }
        .status-msg { font-size: 0.85rem; color: #10b981; text-align: center; margin-top: 0.5rem; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Private Free AI Music Studio</h1>
    <div class="input-group">
        <label for="prompt">Describe your track vibe</label>
        <input type="text" id="prompt" placeholder="e.g., fast techno synth bassline, rave style...">
    </div>
    <button id="genBtn" onclick="generateMusic()">Generate Track</button>
    <div class="status-msg" id="statusMsg">AI is composing... this takes about 10-15 seconds.</div>

    <div class="audio-output" id="audioSection">
        <label>Download Audio Track</label>
        <audio id="audioPlayer" controls></audio>
    </div>
</div>

<script>
    async function generateMusic() {
        const promptInput = document.getElementById('prompt').value;
        const btn = document.getElementById('genBtn');
        const statusMsg = document.getElementById('statusMsg');
        const audioSection = document.getElementById('audioSection');
        const audioPlayer = document.getElementById('audioPlayer');

        if (!promptInput.trim()) {
            alert("Please type a music description first!");
            return;
        }
        
        btn.textContent = 'Generating...';
        btn.disabled = true;
        statusMsg.style.display = 'block';
        audioSection.style.display = 'none';

        try {
            // Corrected API endpoint addressing Meta's MusicGen framework directly
            const response = await fetch(
                "https://huggingface.co",
                {
                    headers: { "Content-Type": "application/json" },
                    method: "POST",
                    body: JSON.stringify({ inputs: promptInput }),
                }
            );

            if (!response.ok) {
                throw new Error("The cloud model server is loading. Please wait 10 seconds and click Generate again!");
            }

            const blob = await response.blob();
            const audioUrl = URL.createObjectURL(blob);
            
            audioPlayer.src = audioUrl;
            audioSection.style.display = 'block';
        } catch (error) {
            alert(error.message);
        } finally {
            btn.textContent = 'Generate Track';
            btn.disabled = false;
            statusMsg.style.display = 'none';
        }
    }
</script>

</body>
</html>
